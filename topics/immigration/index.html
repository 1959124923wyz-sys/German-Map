       azrIds.size!==16||trendMap.size!==16||shareMap.size!==16)throw Error('官方总量或州覆盖不符');
    // Official county pilot remains partial, is keyed by official AGS, and never
    // changes state totals. Never substitute county samples for complete data.
    if(county?.metric_id!=='foreign_population_registered_AZR'||county.observed_at!=='2025-12-31'||
       !['partial_verified_pilot','complete_codes_not_all_spatially_locatable'].includes(county.coverage)||!Array.isArray(county.records)||county.records.length<1||county.records.length>450)
      throw Error('县级试点来源与覆盖范围校验失败');
    const countyMap=new Map(),codeSet=new Set();
    const agsPrefix={'01':'DE-SH','02':'DE-HH','03':'DE-NI','04':'DE-HB','05':'DE-NW','06':'DE-HE',
      '07':'DE-RP','08':'DE-BW','09':'DE-BY','10':'DE-SL','11':'DE-BE','12':'DE-BB',
      '13':'DE-MV','14':'DE-SN','15':'DE-ST','16':'DE-TH'};
    for(const r of county.records){
      if(!/^\d{5}$/.test(r.ags)||codeSet.has(r.ags)||agsPrefix[r.ags.slice(0,2)]!==r.state_iso||
         !ids.has(r.state_iso)||
         !((r.quality==='direct_official_row'&&Number.isSafeInteger(r.value)&&r.value>=0&&r.value%5===0)||
           (r.quality==='cross_district_not_locatable'&&r.value===null))||!r.name_de)throw Error('县级记录编码或人数无效');
      codeSet.add(r.ags);
      if(!countyMap.has(r.state_iso))countyMap.set(r.state_iso,[]);
      countyMap.get(r.state_iso).push(r);
    }
    for(const [iso,countyRows] of countyMap){
      const stateCount=azr.records.find(r=>r.iso===iso).value;
      const sum=countyRows.reduce((acc,r)=>acc+(r.value??0),0);
      if(sum>stateCount)throw Error('县级试点超出州级人数');
      const coverage=county.coverage_by_state?.[iso];
      if(coverage){
        if(coverage.verified_districts!==countyRows.length||coverage.published_state_total!==stateCount||
           coverage.published_district_sum!==sum||coverage.rounding_difference!==stateCount-sum||
           coverage.expected_districts<countyRows.length||
           (coverage.complete&&coverage.expected_districts!==countyRows.length)||
           (coverage.complete&&stateCount-sum>Math.ceil(countyRows.length/2)*5))
          throw Error('县级覆盖、州级合计与舍入误差不一致');
      }
    }
    return {azr,trend,share,county,countyMap,trendMap,shareMap};
  }

    path.setAttribute('fill','none');path.setAttribute('stroke','#91c8db');path.setAttribute('stroke-width','2.5');
    path.setAttribute('stroke-linejoin','round');box.append(path);

<script>
/* Standalone-only map visualizer for German-Map 05.
   True state polygons: host GeoJSON or Eurostat GISCO NUTS 2024 (NUTS1).
   Offline fallback: Natural Earth Germany *country* outline + capital-city markers.
   Never invent missing state boundaries and never interfere with the host map.
*/
(() => {
  'use strict';
  const NS='http://www.w3.org/2000/svg';
  const NUTS_TO_ISO={DE1:'DE-BW',DE2:'DE-BY',DE3:'DE-BE',DE4:'DE-BB',DE5:'DE-HB',DE6:'DE-HH',DE7:'DE-HE',DE8:'DE-MV',DE9:'DE-NI',DEA:'DE-NW',DEB:'DE-RP',DEC:'DE-SL',DED:'DE-SN',DEE:'DE-ST',DEF:'DE-SH',DEG:'DE-TH'};
  // Locations of the 16 state capitals; markers are *reference locations*, not migrant locations.
  const CAPITALS={
   'DE-BW':[9.18,48.78,'斯图加特'],'DE-BY':[11.58,48.14,'慕尼黑'],
   'DE-BE':[13.41,52.52,'柏林'],'DE-BB':[13.06,52.40,'波茨坦'],
   'DE-HB':[8.80,53.08,'不来梅'],'DE-HH':[9.99,53.55,'汉堡'],
   'DE-HE':[8.24,50.08,'威斯巴登'],'DE-MV':[11.41,53.63,'什未林'],
   'DE-NI':[9.74,52.37,'汉诺威'],'DE-NW':[6.78,51.22,'杜塞尔多夫'],
   'DE-RP':[8.27,50.00,'美因茨'],'DE-SL':[7.00,49.23,'萨尔布吕肯'],
   'DE-SN':[13.74,51.05,'德累斯顿'],'DE-ST':[11.63,52.13,'马格德堡'],
   'DE-SH':[10.14,54.32,'基尔'],'DE-TH':[11.03,50.98,'爱尔福特']
  };
  const BASE={x:0,y:0,w:1060,h:1000};
  // Short state names are identifiers, not personal or geographical guesses.
  const MAP_NAMES={'DE-BW':'巴符','DE-BY':'巴伐','DE-BE':'柏林','DE-BB':'勃兰',
    'DE-HB':'不梅','DE-HH':'汉堡','DE-HE':'黑森','DE-MV':'梅前',
    'DE-NI':'下萨','DE-NW':'北威','DE-RP':'莱普','DE-SL':'萨尔',
    'DE-SN':'萨克','DE-ST':'萨安','DE-SH':'石荷','DE-TH':'图林'};
  const format=n=>n==null?'无数据':Number(n).toLocaleString('zh-CN');
  const point=([lon,lat])=>[135+(lon-5.5)*78,45+(55.4-lat)*110];
  const svgNode=(name,attrs={})=>{
    const el=document.createElementNS(NS,name);
    for(const [key,val] of Object.entries(attrs))el.setAttribute(key,String(val));
    return el;
  };
  const geometries=geom=>{
    if(!geom)return [];
    if(geom.type==='Polygon')return [geom.coordinates];
    if(geom.type==='MultiPolygon')return geom.coordinates;
    return [];
  };
  function geoPath(geom){
    const pieces=[];
    for(const polygon of geometries(geom)){
      for(const ring of polygon){
        if(!ring.length)continue;
        pieces.push(ring.map((coords,index)=>{
          const [x,y]=point(coords);
          return (index?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);
        }).join(' '));
        pieces.push('Z');
      }
    }
    return pieces.join(' ');
  }
  function normalize16(raw){
    if(!Array.isArray(raw?.features))return null;
    const filtered=[];
    const seen=new Set();
    for(const source of raw.features){
      const p=source?.properties||{};
      const id=/^DE-[A-Z]{2}$/.test(p.id||'') ? p.id : (NUTS_TO_ISO[p.NUTS_ID] || NUTS_TO_ISO[p.id]);
      if(!/^DE-[A-Z]{2}$/.test(id||'') || seen.has(id) || !geometries(source.geometry).length)continue;
      seen.add(id);
      filtered.push({...source,properties:{...p,id}});
    }
    return filtered.length===16?{type:'FeatureCollection',metadata:raw.metadata||{},features:filtered}:null;
  }
  function normalizeCounties(raw){
    if(!Array.isArray(raw?.features))return null;
    const seen=new Set(),features=[];
    for(const f of raw.features){
      const prop=f?.properties||{};
      // A NUTS3 or municipal code is NOT interchangeable with the 5-digit AGS.
      const code=prop.ags||prop.AGS||prop.id;
      if(typeof code!=='string'||!/^\d{5}$/.test(code)||seen.has(code)||
         !geometries(f.geometry).length)return null;
      seen.add(code);
      features.push({...f,properties:{...prop,ags:code}});
    }
    return features.length ? {type:'FeatureCollection',features,metadata:raw.metadata||{}} : null;
  }
  const colorOf=(row,view)=>{
    if(row?.value==null)return '#8a95a0';
    let i=view.breaks.findIndex(b=>row.value<=b);
    if(i<0)i=4;
    return view.colors[i];
  };
  function create({target,topic}){
    const svg=svgNode('svg',{viewBox:'0 0 1060 1000','aria-label':'德国地图——官方州界或州府点位','role':'img'});
    svg.classList.add('im-map-svg');
    const drawing=svgNode('g');svg.append(drawing);
    target.append(svg);
    const info=document.querySelector('#map-status');
    const hint=document.querySelector('#map-hint');
    const legend=document.querySelector('#map-legend');
    const tip=document.querySelector('#map-tooltip');
    const attribution=document.querySelector('.geocredit');
    function setAttribution(kind){
      if(!attribution)return;
      attribution.replaceChildren();
      const label=document.createElement('span');
      if(kind==='BKG-local' || kind==='BKG-bundled'){
        label.textContent='国界：Natural Earth · 州界：© BKG (2026) ';attribution.append(label);
        const license=document.createElement('a');license.textContent='dl-de/by-2-0';
        license.href='https://www.govdata.de/dl-de/by-2-0';
        license.target='_blank';license.rel='noopener noreferrer';attribution.append(license);
        attribution.append(document.createTextNode(' · 已简化边界'));
      }else if(kind.startsWith('GISCO')){
        label.textContent='国界：Natural Earth · 州界：© EuroGeographics for the administrative boundaries / Eurostat GISCO（非商业使用）';
        attribution.append(label);
      }else if(kind==='host'){
        label.textContent='国界：Natural Earth · 州界：主项目既有行政边界（须保留原数据署名）';
        attribution.append(label);
      }else{
        label.textContent='国界：Natural Earth · 圆点为州府参考位置（不是州行政界限）';
        attribution.append(label);
      }
    }
    let outline=null,stateGeo=null,countyGeo=null,mode='loading';
    let view=null;
    let zoom=1,cx=BASE.w/2,cy=BASE.h/2;
    function setZoom(next){
      zoom=Math.max(1,Math.min(5,next));
      const w=BASE.w/zoom,h=BASE.h/zoom;
      cx=Math.max(w/2,Math.min(BASE.w-w/2,cx));
      cy=Math.max(h/2,Math.min(BASE.h-h/2,cy));
      svg.setAttribute('viewBox',`${(cx-w/2).toFixed(1)} ${(cy-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
    }
    function zoomBy(factor){setZoom(zoom*factor)}
    document.querySelector('#map-zoom-in').addEventListener('click',()=>zoomBy(1.35));
    document.querySelector('#map-zoom-out').addEventListener('click',()=>zoomBy(1/1.35));
    document.querySelector('#map-reset').addEventListener('click',()=>{cx=BASE.w/2;cy=BASE.h/2;setZoom(1)});
    svg.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.17:1/1.17)},{passive:false});
    let panning=null,wasDragging=false;
    svg.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      panning={x:e.clientX,y:e.clientY,cx,cy};wasDragging=false;
    });
    svg.addEventListener('pointermove',e=>{
      if(!panning)return;
      if(Math.hypot(e.clientX-panning.x,e.clientY-panning.y)>6)wasDragging=true;
      const box=svg.getBoundingClientRect();
      cx=panning.cx-(e.clientX-panning.x)*BASE.w/zoom/box.width;
      cy=panning.cy-(e.clientY-panning.y)*BASE.h/zoom/box.height;
      setZoom(zoom);
    });
    window.addEventListener('pointerup',()=>{panning=null});
    function showTip(e,text){
      if(!tip)return;
      tip.textContent=text;
      const box=target.getBoundingClientRect();
      tip.style.left=Math.min(e.clientX-box.left+16,box.width-200)+'px';
      tip.style.top=Math.max(15,e.clientY-box.top-35)+'px';
      tip.hidden=false;
    }
    function hideTip(){if(tip)tip.hidden=true}
    function select(e,id){
      if(!wasDragging)topic.selectState(id);
      wasDragging=false;
    }
    function interactive(el,id,row,extra=''){
      el.setAttribute('tabindex','0');el.setAttribute('role','button');
      el.setAttribute('aria-label',row.name_zh+'：'+(view.unit==='percent'?row.value.toFixed(1)+'%':row.value.toLocaleString('zh-CN')+'人')+extra);
      el.addEventListener('click',e=>select(e,id));
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();topic.selectState(id)}});
      el.addEventListener('pointermove',e=>{if(!panning)showTip(e,row.name_zh+'：'+(view.unit==='percent'?row.value.toFixed(1)+'%':row.value.toLocaleString('zh-CN')+' 人'))});
      el.addEventListener('pointerleave',hideTip);
    }
    function drawCountLabels(rows){
      // Show 16 exact values without hover. Use geographic *state-capital reference*
      // positions to avoid manufacturing county/state geometry. Layout is deterministic.
      const occupied=[];
      const labels=svgNode('g',{class:'im-count-labels'});
      const ordered=[...rows.values()].sort((a,b)=>b.value-a.value);
      const width=145,height=32;
      const intersects=(a,b)=>a.x<b.x+b.w+7 && a.x+a.w+7>b.x &&
        a.y<b.y+b.h+7 && a.y+a.h+7>b.y;
      for(const row of ordered){
        const capital=CAPITALS[row.iso];if(!capital)continue;
        const [px,py]=point(capital);
        const candidates=[
          [px+12,py-35],[px+12,py+9],[px-width-12,py-35],[px-width-12,py+9],
          [px-width/2,py-51],[px-width/2,py+25],
          [px+16,py-14],[px-width-16,py-14],
          [px-width/2,py-82],[px-width/2,py+55]
        ];
        let chosen=null,penalty=Infinity;
        for(const [x,y] of candidates){
          const box={x,y,w:width,h:height};
          const overlaps=occupied.filter(other=>intersects(box,other)).length;
          const edge=Math.max(0,108-x)+Math.max(0,x+width-972)+
            Math.max(0,50-y)+Math.max(0,y+height-954);
          const score=overlaps*10000+edge*200+Math.hypot(x-px,y-py);
          if(score<penalty){chosen=box;penalty=score;}
          if(score<140)break;
        }
        if(!chosen)continue;
        occupied.push(chosen);
        const selected=row.iso===view.selected;
        // A thin leader line makes it clear which state-capital marker a displaced
        // label belongs to; it must not intercept underlying polygon clicks.
        const tx=Math.max(chosen.x,Math.min(px,chosen.x+width));
        const ty=Math.max(chosen.y,Math.min(py,chosen.y+height));
        const leader=svgNode('line',{x1:px,y1:py,x2:tx,y2:ty,class:'im-label-leader',
          'pointer-events':'none'});
        labels.append(leader);
        const label=svgNode('g',{class:'im-count-label'+(selected?' selected':''),
          transform:`translate(${chosen.x.toFixed(2)} ${chosen.y.toFixed(2)})`});
        label.append(svgNode('rect',{x:0,y:0,width,height,rx:5,ry:5,class:'im-label-back'}));
        const text=svgNode('text',{x:8,y:19,class:'im-label-text'});
        const st=svgNode('tspan',{class:'im-label-region'});st.textContent=MAP_NAMES[row.iso]||row.iso;
        const number=svgNode('tspan',{x:49,class:'im-label-number'});number.textContent=view.unit==='percent'?row.value.toFixed(1)+'%':format(row.value);
        text.append(st,number);label.append(text);
        interactive(label,row.iso,row);
        labels.append(label);
      }
      drawing.append(labels);
    }
    function draw(){
      if(!view||!outline)return;
      drawing.replaceChildren();
      if(legend){
        legend.replaceChildren();
        const left=document.createElement('span');left.className='im-legend-end';left.textContent='较低';legend.append(left);
        for(const color of view.colors){const swatch=document.createElement('i');swatch.className='im-swatch';swatch.style.background=color;legend.append(swatch);}
        const right=document.createElement('span');right.className='im-legend-end';right.textContent='较高';legend.append(right);
      }
      const base=svgNode('path',{d:geoPath(outline.features[0].geometry),class:'im-country-outline'});
      drawing.append(base);
      const rows=new Map(view.rows.map(r=>[r.iso,r]));
      if(stateGeo){
        // Large regions first, small city-states last to keep their tiny polygons
        // clickable even when boundaries share complex geometry.
        const extent=geom=>{
          let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
          for(const polygon of geometries(geom))for(const ring of polygon)for(const p of ring){
            minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);
            minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);
          }
          return (maxX-minX)*(maxY-minY);
        };
        const states=[...stateGeo.features].sort((a,b)=>extent(b.geometry)-extent(a.geometry));
        for(const state of states){
          const id=state.properties.id,row=rows.get(id);
          const el=svgNode('path',{d:geoPath(state.geometry),class:'im-state-polygon',
            fill:colorOf(row,view),stroke:id===view.selected?'#ffffff':'#203a4d',
            'stroke-width':id===view.selected?2.9:1.4,'fill-rule':'evenodd'});
          interactive(el,id,row);
          drawing.append(el);
        }
        // County shapes are optional: show them ONLY with official AGS geometry,
        // genuine same-date AZR values and a fully verified county collection.
        let countyOverlayCount=0;
        if(countyGeo&&view.metric==='foreign_population'&&view.year===2025){
          const records=topic.getCountyRecords().filter(r=>r.state_iso===view.selected&&r.value!=null);
          const coverage=topic.getCountyCoverage(view.selected);
          const matched=countyGeo.features.filter(f=>records.some(r=>r.ags===f.properties.ags));
          if(coverage?.complete&&records.length===coverage.expected_districts&&
             matched.length===coverage.expected_districts){
            const recordMap=new Map(records.map(r=>[r.ags,r]));
            const sorted=records.map(r=>r.value).sort((a,b)=>a-b);
            const quantile=[1,2,3,4].map(i=>sorted[Math.ceil(sorted.length*i/5)-1]);
            for(const f of matched){
              const r=recordMap.get(f.properties.ags);
              let index=quantile.findIndex(v=>r.value<=v);if(index<0)index=4;
              const node=svgNode('path',{d:geoPath(f.geometry),class:'im-county-polygon',
                fill:view.colors[index],stroke:'#12283a','stroke-width':1.2,
                'data-county-ags':r.ags,'fill-rule':'evenodd'});
              node.setAttribute('tabindex','0');node.setAttribute('role','button');
              node.setAttribute('aria-label',r.name_zh+'：'+format(r.value)+'人，2025年AZR');
              node.addEventListener('click',e=>{if(!wasDragging)topic.selectCounty(r.ags)});
              node.addEventListener('pointermove',e=>{if(!panning)showTip(e,r.name_zh+' · '+format(r.value)+' 人')});
              node.addEventListener('pointerleave',hideTip);
              node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();topic.selectCounty(r.ags)}});
              drawing.append(node);countyOverlayCount++;
            }
          }
        }
        drawCountLabels(rows);
        info.textContent=view.unit==='percent'?'16州人口占比 · 按州着色':view.year+'年 · 16州外国籍人口数 · 按州着色';
        hint.textContent=countyOverlayCount?'已加载'+countyOverlayCount+'个官方县界：颜色表示选中州各县人数；点击州界或侧栏切换。':'点击州界查看对应人数；滚轮缩放。';
      }else{
        for(const row of view.rows){
          const city=CAPITALS[row.iso];if(!city)continue;
          const [x,y]=point(city);
          const radius=8;
          const circle=svgNode('circle',{cx:x,cy:y,r:radius,class:'im-capital-point',
            fill:colorOf(row,view),stroke:row.iso===view.selected?'#ffffff':'#9bbed1',
            'stroke-width':row.iso===view.selected?2.7:1.3,'fill-opacity':.94});
          interactive(circle,row.iso,row,'（点位标记：'+city[2]+'）');
          drawing.append(circle);
        }
        drawCountLabels(rows);
        info.textContent=view.unit==='percent'?'16州人口占比 · 州府点位显示':view.year+'年 · 16州外国籍人口数 · 州府点位显示';
        hint.textContent='点击圆点查看人数。点位代表州，不是外国籍人口的实际居住点；未绘制州界。';
      }
    }
    async function start(){
      if (window.__IMMIGRATION_INLINE_OUTLINE__) {
        outline = window.__IMMIGRATION_INLINE_OUTLINE__;
      } else {
        const national=await fetch('./data/germany-outline-ne110.geojson');
        if(!national.ok)throw Error('German outline missing: HTTP '+national.status);
        outline=await national.json();
      }
      mode='offline';
      // Locally bundled original-state boundaries work with file:// HTML and
      // without external services. The source remains independently documented.
      const countyEmbedded=normalizeCounties(window.__IMMIGRATION_INLINE_COUNTY_GEOMETRY__);
      if(countyEmbedded)countyGeo=countyEmbedded;
      const embedded=normalize16(window.__IMMIGRATION_INLINE_STATES__);
      if(embedded){
        stateGeo=embedded;
        mode=/BKG|Kartographie/i.test(embedded.metadata?.provider||'')?'BKG-bundled':'GISCO-bundled';
      }
      setAttribution(mode);
      draw();
      if (window.__IMMIGRATION_NO_NETWORK__ || embedded)
        return {mode,matched:stateGeo?.features.length||0};
      const candidates=[
        {url:'../../data/germany-states.geojson',source:'host'},
        {url:'./data/bkg-states-2026.geojson',source:'BKG-local'},
        {url:'./data/gisco-nuts1-de-2024.geojson',source:'GISCO-local'},
        {url:'https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_03M_2024_4326_LEVL_1.geojson',source:'GISCO-web'}
      ];
      for(const candidate of candidates){
        try{
          const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),candidate.source==='GISCO-web'?10000:1500);
          let res;
          try{res=await fetch(candidate.url,{signal:ctrl.signal})}finally{clearTimeout(timer)}
          if(!res.ok)continue;
          const normalized=normalize16(await res.json());
          if(!normalized)continue;
          stateGeo=normalized;mode=candidate.source;setAttribution(mode);draw();break;
        }catch(err){console.info('Optional official state geometry unavailable:',candidate.source,err.message)}
      }
      return {mode,matched:stateGeo?.features?.length||0};
    }
    function update(next){view=next;draw()}
    function useCountyGeometry(raw){countyGeo=normalizeCounties(raw);draw();return countyGeo?.features.length||0;}
    return {start,update,useCountyGeometry,getMode:()=>mode,hasStates:()=>!!stateGeo,reset:()=>setZoom(1)};
  }
  window.ImmigrationStandaloneMap={create,normalize16,normalizeCounties};
})();

</script>
 <script>
 (async()=>{
   const topic=window.GermanMapTopics.immigration;
   const panel=document.getElementById('topic-container');
   try{
     await topic.loadData();
     const visual=window.ImmigrationStandaloneMap.create({target:document.getElementById('map-box'),topic});
     window.__v8Map=visual; // standalone test harness, not exported topic API
     const context={container:panel,onViewChange:state=>visual.update(state)};
     topic.activate(context);
     window.addEventListener('pagehide',()=>topic.deactivate());
     visual.start().catch(err=>{document.getElementById('map-status').textContent='地图边界无法载入';document.getElementById('map-hint').textContent=err.message;});
   }catch(err){const notice=document.createElement('p');notice.id='preview-error';notice.textContent='数据载入失败：'+err.message;panel.append(notice);console.error(err);}
 })();
 </script>
