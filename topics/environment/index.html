<head>

<link rel="stylesheet" href="topic.css?v=clean2">
</head>
<body>
<header>
  <div class="header-main">
    <div class="titleblock">
      <div class="title">德国环保争议地图</div>
      <div class="header-meta">政策 · 行动事件 · 能源设施</div>
    </div>
    <nav class="modebar" aria-label="德国地图专题切换">
      <a class="modebtn" href="../../index.html">暴力犯罪</a>
      <a class="modebtn" href="../../index.html?mode=property">财产犯罪</a>

   <a class="modebtn" href="../housing/">住房危机</a>
 </nav>
  </div>
</header>
<main class="environment-workspace">
  <section class="mapwrap" aria-label="德国环保争议地图">
    <div id="environment-map"></div>
    <div id="mapStatus" class="mapstatus">正在加载街道底图与事件点位…</div>
    <div class="legend" id="legend" aria-label="地图图例"></div>

  </section>
  <aside class="environment-sidebar">
    <div class="controls">
      <div class="env-taxonomy">
        <div class="env-taxonomy-heading"><strong>查看内容</strong><span>按记录类型分类</span></div>
        <div class="env-tabs" role="group" aria-label="按记录性质选择互斥的分类">
          <button type="button" class="active" data-mode="all" aria-pressed="true">全部 <span class="env-tab-count" data-count-for="all">154</span></button>
          <button type="button" data-mode="archive" aria-pressed="false">行动事件 <span class="env-tab-count" data-count-for="archive">41</span></button>
          <button type="button" data-mode="policy" aria-pressed="false">环保政策 <span class="env-tab-count" data-count-for="policy">10</span></button>
          <button type="button" data-mode="project" aria-pressed="false">组织争议 <span class="env-tab-count" data-count-for="project">11</span></button>
          <button type="button" data-mode="facility" aria-pressed="false">能源设施 <span class="env-tab-count" data-count-for="facility">92</span></button>
        </div>
      </div>
    </div>

    <section class="safety-panel" id="summaryPanel">
      <div class="safety-head"><strong id="sectionTitle">全部记录</strong><span class="safety-hint" id="resultScope">点击点位查看详情</span></div>
      <div class="area-title"><div class="area-name" id="areaName">德国全国</div><span class="risk-badge mid" id="kindBadge">专题概览</span></div>
      <div class="area-metric" id="areaMetric">政策、行动与设施</div>
      
      <div class="area-grid">
        <div class="area-stat"><b id="count">154</b><small>当前筛选记录</small></div>
        <div class="area-stat"><b id="regionCount">—</b><small>涉及城市／地点</small></div>
        <div class="area-stat"><b id="sourceCount">—</b><small>引用来源链接</small></div>
      </div>
      <div class="area-note" id="listHint">点击点位查看资料来源。</div>
      <div id="detail" class="env-detail" hidden aria-live="polite"></div>
      <div id="rankSection" class="rank-section">
        <div class="rank-head"><strong>地点分布</strong><span>当前记录数</span></div>
        <div class="rank-list" id="rankList"></div>
      </div>
    </section>

    <details class="incident-drawer" id="recordDrawer">
      <summary>记录列表 <span id="listCount">154 条</span></summary>
      <div id="entries" class="env-entries"></div>
      <button type="button" id="moreRecords" class="more-records" hidden>显示更多记录</button>
    </details>
  </aside>
</main>
<footer><span>精选公开案例 · 资料截至 2026 年 10 月 · 详见各条来源</span><span>© OpenStreetMap contributors · Leaflet</span></footer>

<script src="topic.js?v=clean2"></script>
</body>
</html>
