name: Housing research - official Deutschlandatlas HA26 intake
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_deutschlandatlas.py'
      - '.github/workflows/housing-research-intake.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: housing-ha26-research
  cancel-in-progress: false

jobs:
  official-housing-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch official 2026 Deutschlandatlas county data and audit map joins
        run: |
          python research/housing/build_deutschlandatlas.py
      - name: Check generated data contract
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('topics/housing/data/atlas-counties.json')
          j=json.loads(p.read_text())
          assert len(j['counties'])==400
          for key in ('asking_rent_2025_eur_m2','vacancy_2022_pct','owner_occupier_2022_pct'):
              assert j['meta']['coverage_on_official_400_geometry'][key]==400
          print('Housing baseline validated',j['meta']['coverage_on_official_400_geometry'])
          PY
      - name: Preserve only independently validated data on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/deutschlandatlas_krs2024_ha26.csv research/housing/raw/deutschlandatlas_krs2022_ha26.csv
          git add research/housing/qa/ha26_raw_manifest.json
          git add research/housing/data/deutschlandatlas_ha26_housing_counties.csv
          git add research/housing/qa/ha26_join_audit.json
          git add topics/housing/data/atlas-counties.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: verified official Deutschlandatlas HA26 county metrics [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          else
            echo "No changes to preserve"
          fi
