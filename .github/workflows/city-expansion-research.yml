name: City expansion source probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/city-expansion-research.yml'
      - 'scripts/probe_kiel_sources.py'

permissions:
  contents: read

jobs:
  kiel-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install source probe dependencies
        run: pip install requests pypdf
      - name: Probe official Kiel police statistics and city geodata
        run: python scripts/probe_kiel_sources.py
