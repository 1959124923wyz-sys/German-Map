name: Audit city map topology
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_geometry_seams.py'
      - 'scripts/build_display_counties.py'
      - '.github/workflows/audit-map-geometries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely pyproj requests
      - run: python scripts/audit_geometry_seams.py
      - run: python scripts/build_display_counties.py
