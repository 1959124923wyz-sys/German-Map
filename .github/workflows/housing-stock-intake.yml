name: Housing research - county housing stock crosscheck
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_stock_proxy.py'
      - '.github/workflows/housing-stock-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-stock-intake
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate third-party source, official crosscheck and atlas consistency
        run: python research/housing/build_stock_proxy.py
      - name: Commit complete source, derived data and QA with attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/wohnungsmarkt_kreise_2026_09_24.json
          git add research/housing/qa/stock_cross_source_audit.json
          git add topics/housing/data/stock-counties.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: checked 2022-2025 county stock and population archive [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
