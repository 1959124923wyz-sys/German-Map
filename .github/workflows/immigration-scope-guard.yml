name: Immigration topic ownership guard

on:
  push:
    branches:
      - feature/immigration-topic
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: immigration-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope-and-tests:
    if: github.event_name == 'push' || github.head_ref == 'feature/immigration-topic'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout actual immigration branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert only owned files changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base origin/main HEAD)"
          python topics/immigration/scripts/verify_scope.py --base "$BASE" --head HEAD

      - name: Validate JavaScript and lifecycle
        run: |
          node --check topics/immigration/topic.js
          node --test topics/immigration/tests/test_topic.cjs

      - name: Unit and official-source integrity tests
        run: python -m unittest discover -s topics/immigration/tests -p 'test_*.py' -v

  browser-preview:
    needs: scope-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout actual topic branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser and Leaflet test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          npm install --prefix topics/immigration --no-save leaflet@1.9.4
      - name: Open standalone map and exercise actual pointer events
        run: python topics/immigration/tests/smoke_preview.py
