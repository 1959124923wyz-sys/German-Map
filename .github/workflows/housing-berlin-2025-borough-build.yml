name: Housing research - corrected Berlin 2025 twelve boroughs housing construction
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_berlin_borough_completions.py'
      - '.github/workflows/housing-berlin-2025-borough-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-berlin-2025-borough-parsing
  cancel-in-progress: false
jobs:
  berlin-county-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Verify all 12 Berlin boroughs against four corrected totals
        run: python research/housing/build_berlin_borough_completions.py
      - name: Commit audited Berlin district data for county-only drilldown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/data/berlin_2024_2025_12_borough_completions.csv
          git add research/housing/qa/berlin_2025_corrected_12_borough_completions_audit.json
          git add topics/housing/data/berlin-2024-2025-borough-completions.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: Berlin 2024/25 corrected official 12 borough building completions [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
