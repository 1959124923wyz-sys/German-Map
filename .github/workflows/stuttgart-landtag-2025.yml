name: Stuttgart 2025 Landtag PKS source verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_stuttgart_landtag_2025.py'
      - 'scripts/build_stuttgart_public_violence_2025.py'
      - '.github/workflows/stuttgart-landtag-2025.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests pypdf shapely pyproj
      - name: Build official Stuttgart 23-district geography
        run: python scripts/build_stuttgart_duesseldorf_geometry.py
      - name: Parse and join source verified Stuttgart violence counts
        run: python scripts/build_stuttgart_public_violence_2025.py
      - name: Archive non-public candidate for independent review
        uses: actions/upload-artifact@v4
        with:
          name: stuttgart-2025-official-public-space-violence-candidate
          path: artifacts/stuttgart_violence_candidate.geojson
