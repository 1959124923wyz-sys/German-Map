name: Housing research - verify 2022 Zensus machine code dictionary
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_zensus_column_labels.py'
      - '.github/workflows/housing-zensus-codebook.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-zensus-2022-codebook
  cancel-in-progress: false
jobs:
  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Inspect primary census column headings for exactly mapped machine-code fields
        run: python research/housing/probe_zensus_column_labels.py
      - name: Save official machine code dictionary to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/qa/zensus2022_official_housing_column_codebook.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: preserve primary Zensus census rent vacancy field definitions [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
