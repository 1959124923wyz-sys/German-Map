name: Bremen district join audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_bremen_district_joins.py'
      - 'scripts/build_bremen_geometry_staging.py'
      - 'scripts/extract_bremen_offenses.py'
      - '.github/workflows/bremen-district-join-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install minimal source parsing requirements
        run: pip install requests pypdf shapely pyproj
      - name: Crosswalk police districts to official geographic codes
        run: python scripts/audit_bremen_district_joins.py
      - name: Build and topologically audit unpublished official polygons
        run: python scripts/build_bremen_geometry_staging.py

      - name: Parse and verify 22-by-7 official offense statistics
        run: python scripts/extract_bremen_offenses.py

      - name: Archive audit with unresolved exceptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bremen-police-geography-crosswalk
          path: |
            artifacts/bremen_join_audit.json
            artifacts/bremen_areas_staging.geojson
            artifacts/bremen_cases_staging.json
          if-no-files-found: warn
