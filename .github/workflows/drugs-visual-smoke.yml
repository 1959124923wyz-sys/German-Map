name: Drugs dark-green visual smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'topics/drugs/**'
      - '.github/workflows/drugs-visual-smoke.yml'

permissions:
  contents: read

concurrency:
  group: drugs-visual-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-theme-and-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate JS and county data
        run: |
          node --check topics/drugs/topic.js
          python topics/drugs/scripts/validate_drugs.py
      - name: Open site and verify dark UI, green legend, and real clicks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/drugs-http.log 2>&1 &
          sleep 2
          python topics/drugs/tests/smoke_drugs.py
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drugs-dark-green-preview
          path: |
            /tmp/germany-crime-map-drugs-dark.png
            /tmp/germany-crime-map-drugs-euda.png
          if-no-files-found: warn
