name: Housing research - nationwide census rent bands housing ownership and age
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_zensus_rent_owners.py'
      - '.github/workflows/housing-zensus-owners-rent-bands.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-zensus-2022-rent-owners
  cancel-in-progress: false
jobs:
  ownership-and-rent-bands:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate all 400 county rental brackets and owner categories
        run: python research/housing/build_zensus_rent_owners.py
      - name: Commit verified 2022 rent and building ownership aggregates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/data/zensus2022_rent_band_and_building_ownership_400_counties.csv
          git add research/housing/qa/zensus2022_rent_band_owner_building_age_audit.json
          git add topics/housing/data/zensus2022-county-rent-owner-distribution.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: 2022 county rent bands cooperative municipal owners and dwelling ages [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
