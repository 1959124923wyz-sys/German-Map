name: Drugs standalone public preview probe
on:
  workflow_dispatch:
  push:
    branches: [feature/drugs-topic]
    paths:
      - '.github/workflows/drugs-preview-probe.yml'
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Try GitHub-based preview proxies
        run: |
          set -euo pipefail
          for url in \
            "https://raw.githack.com/1959124923wyz-sys/German-Map/a9feeaba4516bfe4d90076f174f936aa35e1d2f1/topics/drugs/index.html" \
            "https://rawgit.net/1959124923wyz-sys/German-Map/a9feeaba4516bfe4d90076f174f936aa35e1d2f1/topics/drugs/index.html" \
            "https://rawgit.net/_/gh/prod/1959124923wyz-sys/German-Map/a9feeaba4516bfe4d90076f174f936aa35e1d2f1/topics/drugs/index.html" \
            "https://htmlpreview.github.io/?https://github.com/1959124923wyz-sys/German-Map/blob/a9feeaba4516bfe4d90076f174f936aa35e1d2f1/topics/drugs/index.html"; do
              echo "PROBE $url"
              code=$(curl -L --max-time 25 -s -o /tmp/preview_probe -w '%{http_code}' "$url" || true)
              echo "HTTP $code bytes $(wc -c < /tmp/preview_probe)"
              if grep -q 'id="drug-map"' /tmp/preview_probe; then echo 'PASS: drug preview markup'; fi
          done