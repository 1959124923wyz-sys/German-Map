name: Germany crime map UI smoke test

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/germany-homicide-map-smoke.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'topics/drugs/**'
      - 'index.html'
      - 'scripts/smoke_test_ui.py'
      - 'scripts/build_display_counties.py'
      - 'scripts/validate_display_counties.py'
      - 'data/city_layers.json'
      - 'data/city_count_layers.json'
      - 'scripts/build_kiel_staging.py'
      - 'scripts/validate_kiel_count_layer.py'
      - 'scripts/build_bremen_geometry_staging.py'
      - 'scripts/build_bremen_category_layer.py'
      - 'scripts/validate_bremen_category_layer.py'
      - 'scripts/build_stuttgart_duesseldorf_geometry.py'
      - 'scripts/build_stuttgart_public_violence_2025.py'
      - 'scripts/validate_stuttgart_public_violence.py'
      - 'scripts/build_duesseldorf_offenses_2025.py'
      - 'scripts/validate_duesseldorf_offenses_2025.py'
      - 'scripts/build_duesseldorf_bv6_local.py'
      - 'scripts/validate_duesseldorf_bv6_local.py'
      - 'scripts/build_duesseldorf_additional_stadtteile.py'
      - 'scripts/validate_duesseldorf_additional_stadtteile.py'
      - '.github/workflows/germany-homicide-map-smoke.yml'

permissions:
  contents: read

concurrency:
  group: germany-crime-map-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  map-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate Python scripts and crime data
        run: |
          python -m py_compile scripts/update_cases.py
          python -m py_compile scripts/update_crime_categories.py
          python -m py_compile scripts/update_berlin_categories.py
          python -m py_compile scripts/update_berlin_heatmap.py
          python -m py_compile scripts/validate_berlin_heatmap.py
          python -m py_compile scripts/build_pks_violent_2025.py
          python -m py_compile scripts/build_berlin_violent_atlas.py
          python -m py_compile scripts/validate_official_violence_layers.py
          python -m py_compile scripts/smoke_test_ui.py
          python -m py_compile scripts/build_city_layers.py
          python -m py_compile scripts/validate_city_layers.py
          node --check js/core/geo-stats.js
          node --check js/core/config.js
          node --check js/core/data-model.js
          node --check js/panels/drawer-drag.js
          node --check js/panels/state-panel.js
          node --check js/panels/area-panel.js
          node --check js/layers/recent-events.js
          node --check js/layers/berlin-detail.js
          node --check js/layers/county-layer.js
          node --check js/layers/state-layer.js
          node --check js/app.js
          node --check js/layers/city-detail.js
          node --check js/layers/city-count-detail.js
          node --check js/layers/bremen-category-detail.js
          node --check js/layers/stuttgart-public-violence.js
          node --check js/layers/duesseldorf-count-detail.js
          node --check js/layers/duesseldorf-bv6-detail.js
          node --check js/layers/duesseldorf-other-stadtteile.js

      - name: Test deterministic city builder I/O
        run: python scripts/test_city_build_common.py

      - name: Validate city expansion admission and seam contract
        run: |
          python scripts/validate_city_intake.py
          python scripts/test_city_expansion.py

      - name: Refresh Berlin official theft heatmap
        run: python scripts/update_berlin_heatmap.py

      - name: Validate Berlin official heatmap
        run: python scripts/validate_berlin_heatmap.py

      - name: Rebuild Munich city layer with WGS84 coordinates
        run: python scripts/build_city_layers.py --city munich

      - name: Ensure official Dresden complete municipal boundary
        run: |
          if [ ! -s data/dresden-city-boundary.geojson ]; then
            python scripts/build_dresden_city_boundary.py
          else
            echo "Use versioned Dresden boundary for reproducible smoke tests"
          fi

      - name: Build audited Kiel official count-only layer
        run: python scripts/build_kiel_staging.py --output data/kiel_total_cases_2025.geojson --release-count-only

      - name: Validate Kiel independent crime count layer
        run: python scripts/validate_kiel_count_layer.py

      - name: Build Bremen official 22-region geographic candidate
        run: python scripts/build_bremen_geometry_staging.py --output artifacts/bremen_areas_staging.geojson

      - name: Build Bremen official 2024–2025 category count layer
        run: python scripts/build_bremen_category_layer.py --geometry artifacts/bremen_areas_staging.geojson --output data/bremen_local_counts_2025.geojson --release-count-only

      - name: Validate Bremen independent PKS count categories
        run: python scripts/validate_bremen_category_layer.py

      - name: Prepare Stuttgart 23 official urban district polygons
        run: python scripts/build_stuttgart_duesseldorf_geometry.py

      - name: Build official Stuttgart 2025 public-space violent crime overlay
        run: python scripts/build_stuttgart_public_violence_2025.py --output data/stuttgart_public_violence_2025.geojson --release-count-only

      - name: Verify strict Stuttgart public-space PKS statistic boundaries
        run: python scripts/validate_stuttgart_public_violence.py

      - name: Build official 10 Düsseldorf police district counts (2022–2025)
        run: python scripts/build_duesseldorf_offenses_2025.py --output data/duesseldorf_total_cases_2025.geojson --release-count-only

      - name: Validate Düsseldorf district counts and official geometry
        run: python scripts/validate_duesseldorf_offenses_2025.py

      - name: Build Düsseldorf BV6 2025 four-Stadtteil crime categories
        run: python scripts/build_duesseldorf_bv6_local.py --output data/duesseldorf_bv6_local_2025.geojson --release-count-only

      - name: Audit Düsseldorf BV6 official topology and 8 crime categories
        run: python scripts/validate_duesseldorf_bv6_local.py

      - name: Build official Düsseldorf district 7 five-Stadtteil counts
        run: python scripts/build_duesseldorf_additional_stadtteile.py --district 07 --output data/duesseldorf_bv7_local_2025.geojson --release-count-only

      - name: Build official Düsseldorf district 9 two genuine neighbourhood classes
        run: python scripts/build_duesseldorf_additional_stadtteile.py --district 09 --output data/duesseldorf_bv9_local_2025.geojson --release-count-only

      - name: Validate Düsseldorf BV7 and BV9 separate 2025 source-defined PKS groups
        run: |
          python scripts/validate_duesseldorf_additional_stadtteile.py --district 07
          python scripts/validate_duesseldorf_additional_stadtteile.py --district 09

      - name: Harmonize display-only nationwide county boundaries
        run: python scripts/build_display_counties.py

      - name: Validate nationwide and city boundary topology
        run: python scripts/validate_display_counties.py

      - name: Validate expanded crime data
        run: |
          python scripts/validate_crime_data.py
          python scripts/validate_city_layers.py

      - name: Validate official violence baselines
        run: python scripts/validate_official_violence_layers.py

      - name: Start local map server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/germany-map-server.log 2>&1 &
          echo $! > /tmp/germany-map-server.pid
          sleep 1

      - name: Simulate blocked OSM tiles and render map
        env:
          SMOKE_URL: http://127.0.0.1:8765/
          SMOKE_SCREENSHOT: /tmp/germany-crime-map-national.png
        run: python scripts/smoke_test_ui.py

      - name: Regression test drug topic and first-level navigation
        run: |
          python topics/drugs/scripts/validate_drugs.py
          node --check topics/drugs/topic.js
          python topics/drugs/tests/smoke_drugs.py
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width':1440,'height':900})
              page.goto('http://127.0.0.1:8765/',wait_until='domcontentloaded')
              assert page.locator('#modeDrugs').count()==1
              page.locator('#modeDrugs').click()
              page.wait_for_url('**/topics/drugs/')
              page.wait_for_function('() => document.querySelector("#county-count")?.textContent.includes("/")',timeout=40000)
              links=page.locator('nav.toplinks .modebtn')
              assert links.count()==4
              assert links.nth(3).get_attribute('href')=='../immigration/'
              links.nth(1).click()
              page.wait_for_url('**/index.html?mode=property')
              page.wait_for_function('() => document.querySelector("#modeProperty")?.classList.contains("active")',timeout=40000)
              print('PASS main → drugs → property navigation')
              browser.close()
          PY

      - name: Upload rendered screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: germany-crime-map-smoke
          path: /tmp/germany-crime-map-*.png
          if-no-files-found: warn
