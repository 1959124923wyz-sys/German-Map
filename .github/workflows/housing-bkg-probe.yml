name: Housing research - official 2024 boundary probe
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_bkg_kreise.py'
      - '.github/workflows/housing-bkg-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bkg-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python research/housing/probe_bkg_kreise.py
      - name: Preserve endpoint inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/qa/bkg_geometry_endpoint_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "housing GIS: identify official 2024 VG250 county IDs [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
