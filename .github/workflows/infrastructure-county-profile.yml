name: Infrastructure county AGS crosswalk profile
on:
  push:
    branches: [feature/infrastructure-map-phase1]
    paths:
      - 'topics/infrastructure/research/scripts/profile_county_keys.py'
      - '.github/workflows/infrastructure-county-profile.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: infrastructure-county-profile
  cancel-in-progress: false
jobs:
  validate-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/infrastructure-map-phase1
      - name: Profile county geometry and BASt region names
        run: python topics/infrastructure/research/scripts/profile_county_keys.py
      - name: Commit auditable profiling data
        run: |
          git config user.name 'german-map-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topics/infrastructure/research/county_crosswalk_profile.json
          if ! git diff --cached --quiet; then
            git commit -m "research: save county AGS/source-label crosswalk profile"
            git pull --rebase origin feature/infrastructure-map-phase1
            git push origin HEAD:feature/infrastructure-map-phase1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-county-profile
          path: topics/infrastructure/research/county_crosswalk_profile.json
          if-no-files-found: warn
