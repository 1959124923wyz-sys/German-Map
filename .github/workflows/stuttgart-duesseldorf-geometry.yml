name: Stuttgart and Duesseldorf municipal geometry audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_stuttgart_duesseldorf_geometry.py'
      - 'scripts/build_stuttgart_duesseldorf_geometry.py'
      - '.github/workflows/stuttgart-duesseldorf-geometry.yml'

permissions:
  contents: read

jobs:
  official-geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install source QA dependencies
        run: pip install requests shapely pyproj
      - name: Probe both cities' authoritative boundary files
        run: python scripts/probe_stuttgart_duesseldorf_geometry.py
      - name: Build and validate geographic candidate GeoJSON only
        run: python scripts/build_stuttgart_duesseldorf_geometry.py
      - name: Archive candidate district boundaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stuttgart-duesseldorf-official-district-candidates
          path: artifacts/*_district_boundaries_candidate.geojson
          if-no-files-found: warn
