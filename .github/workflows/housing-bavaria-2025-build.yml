name: Housing research - Bavaria 2025 county new residential construction verified
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_bavaria_2025_completions.py'
      - '.github/workflows/housing-bavaria-2025-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-bavaria-2025-data
  cancel-in-progress: false
jobs:
  bavarian-counties:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Validate 96 Bavarian Kreis AGS against 7 Regierungsbezirke
        run: python research/housing/build_bavaria_2025_completions.py
      - name: Commit only successful 2025 original figure reconciliations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/data/bavaria_2025_residential_completions_96_counties.csv
          git add research/housing/qa/bavaria_2025_96_district_completions_audit.json
          git add topics/housing/data/bavaria-new-home-completions-2025.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: Bavaria 2025 96 county completions new/all measures [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
