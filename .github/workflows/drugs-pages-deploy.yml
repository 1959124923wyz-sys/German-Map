name: Publish German-Map website

on:
  push:
    branches: [main]
    paths:
      - 'topics/drugs/**'
      - 'topics/immigration/**'
      - 'topics/environment/**'
      - 'topics/railway/**'
      - 'topics/finance/**'
      - 'topics/industry/**'
      - 'topics/infrastructure/**'
      - 'topics/housing/**'
      - 'research/housing/HANDOFF.md'
      - 'research/finance/**'
      - 'scripts/validate_site_assets.py'
      - 'js/layers/city-labels.js'
      - 'js/core/place-names-zh.js'
      - 'js/app.js'
      - 'css/map.css'
      - 'index.html'
      - '.github/workflows/drugs-pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Same Pages lock as main updater: prevent simultaneous publishers.
concurrency:
  group: german-map-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate website scripts and source assets
        run: |
          node --check topics/drugs/topic.js
          node --check topics/immigration/topic.js
          node --check topics/immigration/data/azr-records.js
          test -s topics/immigration/data/azr-records.js
          # Railway official geometry and observational aggregates are static JS.
          test -s topics/railway/index.html
          test -s topics/railway/js/app.js
          grep -Fq 'href="topics/railway/"' index.html
          grep -Fq 'href="../railway/"' topics/drugs/index.html
          grep -Fq 'href="../railway/"' topics/immigration/index.html
          grep -Fq 'href="../railway/"' topics/environment/index.html
          python - <<'RAIL_AUDIT'
          import re
          from pathlib import Path
          h=Path('topics/railway/index.html').read_text(encoding='utf-8')
          scripts=[src.split('?',1)[0] for src in re.findall(r'<script src="([^"]+)"', h)]
          # Verify actual required assets rather than pinning an obsolete
          # number of script tags whenever UI/data modules are separated.
          required={'js/states.js','overview.js','js/station-zh.js','js/rail-geometry.js','js/rail-analysis.js','js/rail-picker.js','js/rail-service-groups.js','js/rail-city-corridors.js','js/rail-bridge.js','js/rail-continuity.js','js/rail-color-runs.js','data/data-core.js','data/data-sections-00.js','data/data-sections-01.js','data/data-sections-02.js'}
          assert required <= set(scripts), (required-set(scripts))
          assert len(scripts)==len(set(scripts)), 'Duplicate railway script inclusion'
          external=[u for u in scripts if u.startswith('https://')]
          assert external==['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'], external
          local=[u for u in scripts if not u.startswith('https://')]
          assert all((Path('topics/railway')/path).is_file() for path in local)
          assert all((Path('topics/railway')/path).stat().st_size > 0 for path in local)
          assert 'js/station-zh.js' in local and '../../js/layers/city-labels.js' in local
          assert Path('topics/railway/data/data-sections-02.js').stat().st_size > 100000
          assert 'toplinks' in h and '铁路运行' in h
          assert Path('topics/railway/research.html').is_file()
          assert Path('topics/railway/overview.css').is_file()
          print('PASS continuous official railway backbone, complete network sections and passenger risk overlays', len(scripts))
          RAIL_AUDIT
          node --check topics/railway/overview.js
          node --check topics/railway/js/rail-geometry.js
          node --check topics/railway/js/rail-analysis.js
          node --check topics/railway/js/rail-bridge.js
          node --check topics/railway/js/rail-picker.js
          node --check topics/railway/js/rail-service-groups.js
          node --check topics/railway/js/rail-city-corridors.js
          node --check topics/railway/js/rail-continuity.js
          node --check topics/railway/js/rail-color-runs.js
          # Finance 08: same source-preserving validation as its dedicated PR checks.
          test -s topics/finance/index.html
          test -s topics/finance/topic.css
          grep -Fq 'href="topics/finance/"' index.html
          grep -Fq 'href="../finance/"' topics/drugs/index.html
          grep -Fq 'href="../finance/"' topics/immigration/index.html
          grep -Fq 'href="../finance/"' topics/environment/index.html
          grep -Fq 'href="../finance/"' topics/railway/index.html
          node --check topics/finance/topic.js
          node --check topics/finance/data/finance-data.js
          node --check topics/finance/data/finance-history.js
          node --check topics/finance/data/finance-integrated.js
          node --check topics/finance/data/finance-regional-evidence.js
          python topics/finance/tests/validate_finance.py
          python topics/finance/tests/validate_finance_history.py
          python topics/finance/tests/validate_finance_integrated.py
          python topics/finance/tests/validate_finance_regional.py
          python topics/finance/data/build_finance_municipal.py --verify
          # 09/10/11: all independent topic source checks; public site must
          # retain real source/provenance and the same lone Pages deployment.
          node --check topics/industry/topic.js
          node --check topics/infrastructure/topic.js
          node --check topics/housing/topic.js
          node topics/industry/tests/validate_industry.cjs
          node topics/industry/tests/smoke_industry_data.cjs
          node topics/infrastructure/tests/validate_data.cjs
          test -s topics/housing/data/germany-counties-2024.geojson
          test -s topics/housing/data/atlas-counties.json
          test -s research/housing/HANDOFF.md
          grep -Fq 'href="topics/industry/"' index.html
          grep -Fq 'href="topics/infrastructure/"' index.html
          grep -Fq 'href="topics/housing/"' index.html
          grep -Fq 'topics/finance/' index.html

          node topics/railway/tests/unit_core.cjs
          python scripts/validate_site_assets.py
          node --check topics/railway/js/station-zh.js
          node --check topics/railway/js/app.js
          node --check topics/environment/topic.js
          node --check topics/environment/data/records.js
          test -s topics/environment/index.html
          test -s topics/environment/topic.css
          grep -Fq '环境' topics/environment/index.html || grep -Fq '环保' topics/environment/index.html
          grep -Fq 'href="topics/environment/"' index.html
          grep -Fq 'href="../environment/"' topics/drugs/index.html
          grep -Fq 'href="../environment/"' topics/immigration/index.html
          test -f topics/immigration/index.html
          grep -Fq 'germany-states.geojson' topics/immigration/topic.js
          grep -Fq 'germany-counties.geojson' topics/immigration/topic.js
          grep -Fq 'data/azr-records.js' topics/immigration/index.html
          grep -Fq '14070225' topics/immigration/data/azr-records.js
          node --check js/layers/city-labels.js
          node --check js/core/place-names-zh.js
          grep -Fq 'place-names-zh.js' index.html
          grep -Fq 'place-names-zh.js' topics/drugs/index.html
          grep -Fq 'place-names-zh.js' topics/immigration/index.html
          # Prevent Chromium's black rectangular SVG-path focus boxes.
          grep -Fq '#map .leaflet-interactive' css/map.css
          grep -Fq '#drug-map .leaflet-interactive' topics/drugs/topic.css
          grep -Fq 'href="css/map.css?' index.html
          grep -Fq 'href="topic.css?' topics/drugs/index.html
          node --check topics/drugs/wastewater.js
          node --check topics/drugs/news.js
          node --check topics/drugs/state-evidence.js
          grep -Fq 'id="region-change"' topics/drugs/index.html
          grep -Fq 'id="region-news-list"' topics/drugs/index.html
          grep -Fq 'id="region-evidence"' topics/drugs/index.html
          if grep -q 'id="state-panel"' topics/drugs/index.html; then echo 'Duplicated region popup detected'; exit 1; fi
          python topics/drugs/scripts/validate_drugs.py
          python topics/drugs/scripts/validate_state_evidence.py
          python - <<'PY'
          import json
          data=json.load(open('topics/drugs/data/euda_wastewater_2025.json'))
          assert data['meta']['study_year']==2025 and len(data['sites'])==13
          assert all(len(s['observations'])==6 for s in data['sites'])
          evidence=json.load(open('topics/drugs/data/state_health_offences_2025.json'))
          assert evidence['meta']['year']==2025
          assert len(evidence['mortality_by_state'])==evidence['meta']['mortality_coverage_states']
          assert len(evidence['selected_offence_codes_by_state'])==evidence['meta']['drug_specific_offence_coverage_states']
          assert len(evidence['other_health_indicators_by_state'])==1
          for state,x in evidence['mortality_by_state'].items():
              assert x['cases']>=0 and x['source_url'].startswith('https://')
          for state,x in evidence['selected_offence_codes_by_state'].items():
              assert x['source_url'].startswith('https://')
              assert x['groups'] or x.get('additional_metrics')
              assert all(row['general']>=0 and row['trade']>=0 for row in x['groups'])
              assert all(row['cases']>=0 for row in x.get('additional_metrics', []))
          for state,x in evidence['other_health_indicators_by_state'].items():
              assert x['source_url'].startswith('https://')
              assert all(row['cases']>=0 and row['previous_2024']>=0 for row in x['metrics'])
          print(f"PASS 2025 evidence: {len(evidence['mortality_by_state'])} state deaths, {len(evidence['selected_offence_codes_by_state'])} state offence groups, {len(evidence['other_health_indicators_by_state'])} state health sources")
          print('PASS EUDA wastewater 13 German sites, six substances')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      # GitHub's artifact index can lag immediately after a successful upload.
      # A same-run retry duplicates the `github-pages` artifact, so wait before
      # invoking deploy-pages, rather than retrying the whole job.
      - name: Wait for uploaded Pages artifact to become queryable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and (.expired | not))] | length' 2>/dev/null) || count=0
            if [ "$count" = "1" ]; then
              sleep 5
              echo "Pages artifact is indexed and ready"
              exit 0
            fi
            if [ "$count" != "0" ]; then
              echo "Expected exactly one Pages artifact; found $count"
              exit 1
            fi
            sleep 5
          done
          echo "Pages artifact indexing timed out"
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
