name: Housing research - Bavaria 2025 official county table cell inventory
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_bavaria_2025_layout.py'
      - '.github/workflows/housing-bavaria-2025-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-bavaria-2025-layout
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Inspect all four official 2025 Bavaria county pages
        run: python research/housing/probe_bavaria_2025_layout.py
      - name: Preserve matrix of original 2025 district header/value cells
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/qa/bavaria_2025_construction_district_table_layout.json
          if ! git diff --cached --quiet; then
            git commit -m "housing research: Bavaria 2025 official county table matrix [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
