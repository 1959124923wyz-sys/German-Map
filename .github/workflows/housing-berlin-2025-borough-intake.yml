name: Housing research - Berlin 2025 corrected borough completed housing intake
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_berlin_borough_2025.py'
      - '.github/workflows/housing-berlin-2025-borough-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-berlin-2025-borough-intake
  cancel-in-progress: false
jobs:
  berlin-corrected:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Acquire corrected original from Berlin-Brandenburg official authority
        run: python research/housing/probe_berlin_borough_2025.py
      - name: Store verified XLSX and forensic schema for future subcounty work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/berlin_2025_borough_completions_corrected_official.xlsx
          git add research/housing/qa/berlin_2025_corrected_borough_completions_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: corrected Berlin 2025 borough completions primary XLSX [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
