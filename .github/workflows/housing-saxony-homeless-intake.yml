name: Housing research - Saxony official housed-homelessness workbooks
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_saxony_homeless.py'
      - '.github/workflows/housing-saxony-homeless-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-saxony-2026-intake
  cancel-in-progress: false
jobs:
  official-saxony:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - run: python research/housing/probe_saxony_homeless.py
      - name: Commit source workbooks and structure QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/saxony_homeless_2026_district.xlsx
          git add research/housing/raw/saxony_homeless_2022_2026_district.xlsx
          git add research/housing/qa/saxony_homeless_workbook_layout.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: archive Saxony 2026 official county homeless workbooks [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
