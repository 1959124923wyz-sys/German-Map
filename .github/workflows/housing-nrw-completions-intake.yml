name: Housing research - official NRW completions intake
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_nrw_completions.py'
      - '.github/workflows/housing-nrw-completions-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-nrw-building-intake
  cancel-in-progress: false
jobs:
  nrw-completions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python research/housing/probe_nrw_completions.py
      - name: Archive source and audit in research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/nrw_baufertigstellungen_31121_06i.csv
          git add research/housing/qa/nrw_baufertigstellungen_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: archive NRW official district completions source [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
