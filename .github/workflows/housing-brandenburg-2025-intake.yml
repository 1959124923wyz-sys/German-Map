name: Housing research - Brandenburg 2025 official completions XLSX
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_brandenburg_2025_completions.py'
      - '.github/workflows/housing-brandenburg-2025-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-brandenburg-2025-intake
  cancel-in-progress: false
jobs:
  brandenburg-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Acquire official Amt für Statistik Berlin-Brandenburg 2025 county XLSX
        run: python research/housing/probe_brandenburg_2025_completions.py
      - name: Preserve original and schema audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/brandenburg_2025_18_county_completions_official.xlsx
          git add research/housing/qa/brandenburg_2025_completions_original_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "housing raw: official Brandenburg 2025 county housing completions [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
