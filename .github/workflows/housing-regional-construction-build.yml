name: Housing research - 2023 national county new residential completions
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_regionalstatistik_completions.py'
      - '.github/workflows/housing-regional-construction-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-regional-2023-31121-extract
  cancel-in-progress: false
jobs:
  build-country:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract validated 2023 full country county residential new-build units
        run: python research/housing/build_regionalstatistik_completions.py
      - name: Commit verified series, region QA and map dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/data/regionalstatistik_new_dwellings_counties_2023.csv
          git add research/housing/qa/regionalstatistik_2023_completions_county_audit.json
          git add topics/housing/data/germany-residential-completions-2023.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: 2023 nationwide completed new residential dwellings [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
