name: Housing research - extract official Zensus 2022 400 county housing tables
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_destatis_zensus_counties.py'
      - '.github/workflows/housing-zensus-national-counties.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-zensus-national-county-extract
  cancel-in-progress: false
jobs:
  county-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Extract national machine-readable county building/dwelling statistics
        run: python research/housing/build_destatis_zensus_counties.py
      - name: Commit count-verified district sheets and code dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/data/zensus2022_official_400_counties_*.csv
          git add research/housing/qa/zensus2022_official_county_extract_audit.json
          git add topics/housing/data/zensus2022-county-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: 400 district Zensus 2022 building and dwelling census archive [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
