name: Housing research - nationwide 2025 homeless district series
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_destatis_homeless.py'
      - '.github/workflows/housing-destatis-homeless-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-destatis-22971-extract
  cancel-in-progress: false
jobs:
  nationwide-county-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate multidimensional official nationwide totals and county exact joins
        run: python research/housing/build_destatis_homeless.py
      - name: Commit checked county series and QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/data/destatis_sheltered_homeless_counties_2025.csv
          git add research/housing/qa/destatis_homeless_2025_county_audit.json
          git add topics/housing/data/germany-homeless-counties-2025.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: verified Germany 2025 sheltered homeless by county [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
