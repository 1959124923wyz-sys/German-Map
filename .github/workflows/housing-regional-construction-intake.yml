name: Housing research - nationwide regional county construction data
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_regionalstatistik_completions.py'
      - '.github/workflows/housing-regional-construction-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-regional-31121-01-02-4
  cancel-in-progress: false
jobs:
  national-completions:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download county completions and establish exact schema
        run: python research/housing/probe_regionalstatistik_completions.py
      - name: Commit full official source with SHA256 and headers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/regionalstatistik_31121-01-02-4_national_counties.csv
          git add research/housing/qa/regionalstatistik_31121_county_completions_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: nationwide Regionalstatistik 31121 county completions source [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
