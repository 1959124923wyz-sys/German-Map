name: Finance 08 - Official 2024 Municipal Geography Vintage (Research Only)
on:
  push:
    branches: [research/finance-regional-expansion-20261010]
    paths:
      - 'research/finance/regional-expansion/build_bkg2024_ags.py'
      - '.github/workflows/finance-bkg2024-ags.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finance08-bkg2024-ags
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get official archived 2024 BKG geometry and compare with actual 2024 debt AGS
        id: inspect
        continue-on-error: true
        run: |
          set +e
          python research/finance/regional-expansion/build_bkg2024_ags.py > /tmp/finance08_bkg2024.log 2>&1
          rc=$?
          cat /tmp/finance08_bkg2024.log
          mkdir -p research/finance/regional-expansion/derived/bkg2024/
          EXIT_CODE=$rc python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('research/finance/regional-expansion/derived/bkg2024/last_run_status.json')
          rc=int(os.environ['EXIT_CODE'])
          logs=Path('/tmp/finance08_bkg2024.log').read_text(encoding='utf-8',errors='replace')
          p.write_text(json.dumps({'exit_code':rc,'verified':rc==0,
            'status':'official_2024_ags_reconciled' if rc==0 else 'failed_no_2024_geometry',
            'notes':logs[-3200:]},indent=2)+'\n',encoding='utf-8')
          PY
          exit $rc
      - name: Archive official 2024 AGS or failure diagnosis in research branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/finance/regional-expansion/derived/bkg2024/
          if ! git diff --cached --quiet; then
            git commit -m "data(finance): inspect 2024 vintage German municipality boundary source"
            git pull --rebase origin research/finance-regional-expansion-20261010
            git push origin HEAD:research/finance-regional-expansion-20261010
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance08-official-2024-BKG-archive
          path: /tmp/finance08-bkg2024/BKG_vg250ew_2024_original.zip
          retention-days: 30
          if-no-files-found: warn
      - name: Require exact 2024 municipality-vintage verification
        if: always()
        run: test "${{ steps.inspect.outcome }}" = success
