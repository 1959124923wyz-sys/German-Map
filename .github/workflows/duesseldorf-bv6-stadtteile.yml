name: Düsseldorf BV6 2025 neighborhood source QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_duesseldorf_bv6_stadtteile.py'
      - 'scripts/build_duesseldorf_bv6_local.py'
      - '.github/workflows/duesseldorf-bv6-stadtteile.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests pypdf shapely pyproj
      - name: Rebuild official Düsseldorf district geometry for independent BV6 coverage
        run: python scripts/build_stuttgart_duesseldorf_geometry.py
      - name: Crosscheck four street areas and eight official 2022-2025 crime categories
        run: python scripts/build_duesseldorf_bv6_local.py
      - name: Archive official neighbourhoods and source-count QA
        uses: actions/upload-artifact@v4
        with:
          name: duesseldorf-bv6-four-official-stadtteile-candidate
          path: artifacts/duesseldorf_bv6_local_candidate.geojson
          if-no-files-found: error
