name: Housing research - Saxony 2022 census original workbooks
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/probe_saxony_zensus2022.py'
      - '.github/workflows/housing-saxony-zensus2022-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-zensus-saxony
  cancel-in-progress: false
jobs:
  zensus-workbooks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - name: Download and inventory four original Saxony census datasets
        run: python research/housing/probe_saxony_zensus2022.py
      - name: Commit validated raw XLSX and reproducible schema audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/raw/saxony_zensus2022_*.xlsx
          git add research/housing/qa/saxony_zensus2022_workbook_inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: archive four verified official Zensus 2022 Saxony workbooks [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
