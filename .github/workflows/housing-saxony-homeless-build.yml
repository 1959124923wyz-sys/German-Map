name: Housing research - Saxony official five-year homelessness series
on:
  push:
    branches:
      - research/housing-crisis-20261010
    paths:
      - 'research/housing/build_saxony_homeless.py'
      - '.github/workflows/housing-saxony-homeless-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-saxony-2026-build
  cancel-in-progress: false
jobs:
  checked-series:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/housing-crisis-20261010
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - run: python research/housing/build_saxony_homeless.py
      - name: Preserve parsed 2022-2026 official Saxony data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/housing/data/saxony_official_homeless_2022_2026.csv
          git add research/housing/qa/saxony_homeless_audit.json
          git add topics/housing/data/saxony-homeless-counties.json
          if ! git diff --cached --quiet; then
            git commit -m "housing data: checked Saxony official 13-county housed homeless 2022-2026 [skip ci]"
            git pull --rebase origin research/housing-crisis-20261010
            git push origin HEAD:research/housing-crisis-20261010
          fi
