name: Infrastructure BASt points on BKG official counties
on:
  push:
    branches: [feature/infrastructure-map-phase1]
    paths:
      - 'topics/infrastructure/research/scripts/spatial_bridge_points_official_bkg2025.py'
      - '.github/workflows/infrastructure-bridge-bkg-spatial.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: infrastructure-bridge-bkg-spatial
  cancel-in-progress: false
jobs:
  bkg-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/infrastructure-map-phase1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official boundary matching engine
        run: pip install 'shapely>=2,<3'
      - name: Join cached BASt source points to official BKG 2025 polygons
        run: python topics/infrastructure/research/scripts/spatial_bridge_points_official_bkg2025.py
      - name: Validate source and all 400 district denominators
        run: |
          python - <<'PY'
          import json,gzip,csv
          from pathlib import Path
          base=Path('topics/infrastructure/research')
          d=json.loads((base/'candidate_bridge_official_bkg_counties_2025.json').read_text())
          assert d['source_bridge_parts']==52553==d['assigned']+d['unassigned']
          assert sum(x['parts'] for x in d['data'])==d['assigned']
          assert len(d['data'])==400
          assert len({x['ags'] for x in d['data']})==400
          assert d['bkg_not_replacing_main'] is True
          with gzip.open(base/'bast_bridge_point_bkg2025_audit.csv.gz','rt',encoding='utf8') as f:
            n=sum(1 for x in csv.DictReader(f))
          assert n==52553
          print('PASS BKG authoritative 400 AGS, BASt source all IDs, candidate isolation, missingness checks')
          PY
      - name: Commit BKG county candidate and raw point audit on isolated branch
        run: |
          git config user.name 'german-map-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topics/infrastructure/research/candidate_bridge_official_bkg_counties_2025.json topics/infrastructure/research/bast_bridge_point_bkg2025_audit.csv.gz
          if ! git diff --cached --quiet; then
            git commit -m "research: save bridge grades for 400 BKG 2025 counties with 52,553 point audit"
            git pull --rebase origin feature/infrastructure-map-phase1
            git push origin HEAD:feature/infrastructure-map-phase1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-bast-bkg2025-spatial
          path: |
            topics/infrastructure/research/candidate_bridge_official_bkg_counties_2025.json
            topics/infrastructure/research/bast_bridge_point_bkg2025_audit.csv.gz
          if-no-files-found: warn
